name: Release FCV-588 Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-standalone-fcv588:
    name: Build Standalone HTML & Windows Installers
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git longpaths and skip LFS smudge
        run: |
          git config --global core.longpaths true
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"

      - name: Checkout repository (without LFS blobs)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & check single-file FCV-588 Standalone HTML
        run: |
          node tools/build_fcv588_standalone.mjs --check
          node tools/build_fcv588_standalone.mjs

      - name: Install Electron packager dependencies
        working-directory: apps/fcv588-electron-p30
        run: npm install --no-audit --no-fund

      - name: Verify synced Electron unit & replay matrix tests
        run: npm --prefix apps/fcv588-electron-p30 test

      - name: Build Windows Portable (.exe) and NSIS Setup Installer (.exe)
        run: npm --prefix apps/fcv588-electron-p30 run package:win

      - name: Verify generated artifacts exist
        run: |
          test -f "dist/FCV-588-Standalone.html"
          test -f "dist/electron/FCV-588-Portable-1.0.0-win-x64.exe"
          test -f "dist/electron/FCV-588-Setup-1.0.0-win-x64.exe"
          ls -lh dist/FCV-588-Standalone.html dist/electron/*.exe

      - name: Upload Standalone HTML & Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FCV-588-Standalone-Windows-Installer-and-HTML
          if-no-files-found: error
          path: |
            dist/FCV-588-Standalone.html
            dist/electron/FCV-588-Portable-1.0.0-win-x64.exe
            dist/electron/FCV-588-Setup-1.0.0-win-x64.exe

      - name: Publish Permanent GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cat <<'NOTES' > dist/RELEASE_NOTES.md
          ## FURUNO FCV-588 — Phần mềm Mô phỏng Máy Đo Sâu Dò Cá Độc Lập (v1.0.0)

          ### 3 Định dạng Tải về & Chạy ngay (100% Offline, Không cần cài Node.js)
          1. **`FCV-588-Portable-1.0.0-win-x64.exe`** — **1 file `.exe` duy nhất cho Windows (x64)**: Tải về nhấp đúp chạy ngay lập tức, không cần cài đặt.
          2. **`FCV-588-Setup-1.0.0-win-x64.exe`** — **Bộ cài đặt chuẩn Windows NSIS**: Cài đặt vào máy tính và tự tạo biểu tượng ngoài Desktop & Start Menu (`FURUNO FCV-588 Simulator`).
          3. **`FCV-588-Standalone.html`** — **1 file `.html` đa nền tảng (~740 KB)**: Chạy trực tiếp trên Windows / macOS / Linux bằng trình duyệt bất kỳ hoàn toàn offline.

          ### Điểm nổi bật của bản hoàn thiện FCV-588 v1.0.0
          - **Giao diện mặt máy & LCD chuẩn 100% thực tế:** Viền kính đen `FURUNO`, cụm phím đồng tâm `MENU/ESC + TrackPad + ENTER`, núm xoay `GAIN` / `MODE` (hỗ trợ kéo chuột, con lăn, nhấp đơn xem trước & nhấp đúp chuyển tức thời), nút nguồn viên thuốc xanh dương `BRILL`, thanh tiêu đề xanh dương đặc (`MAN_R G: 10 LF/HF ... 13.6V`), số độ sâu Halo cỡ lớn, `White Line: Edge` (`Bien`) bám sát địa hình đáy.
          - **Hỗ trợ trọn vẹn Tiếng Việt (`D04 Tieng Viet`) & Tiếng Anh (`65/65` tính năng, `0 NOT_IMPLEMENTED`)** kèm chu trình khởi động lại 4 nhịp như máy thật.
          - **Âm thanh phần cứng Web Audio Buzzer:** Tái tạo tiếng *pip* bật/tắt máy, tiếng *bíp* bấm phím / xoay núm và còi báo động ngắt quãng (`Fish` / `Bottom` / `Arrival` / `Temp`) tắt còi khi nhấn phím bất kỳ theo manual `§1.18` (có nút `Loa máy: BẬT/TẮT`).
          - **Không gian làm việc ổn định tuyệt đối (`0.00px` layout shift):** Lưu/Nạp cấu hình `.json` tức thời, Xuất/Phát lại phiên Replay tất định, chế độ `Tập trung vào máy` và `Toàn màn hình (F11)`.

          > *Lưu ý an toàn: Phần mềm phục vụ huấn luyện và giảng dạy độc lập, không kết nối đầu dò/GPS thực tế và không dùng để dẫn tàu.*
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/FCV-588-Standalone.html" \
              "dist/electron/FCV-588-Portable-1.0.0-win-x64.exe" \
              "dist/electron/FCV-588-Setup-1.0.0-win-x64.exe" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/FCV-588-Standalone.html" \
              "dist/electron/FCV-588-Portable-1.0.0-win-x64.exe" \
              "dist/electron/FCV-588-Setup-1.0.0-win-x64.exe" \
              --title "FURUNO FCV-588 Standalone Simulator ($TAG)" \
              --notes-file dist/RELEASE_NOTES.md
          fi
