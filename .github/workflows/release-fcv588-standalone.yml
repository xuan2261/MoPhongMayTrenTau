name: Release FCV-588 Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-standalone-fcv588:
    name: Build Standalone HTML & Windows Installers
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure Git longpaths and skip LFS smudge
        run: |
          git config --global core.longpaths true
          git config --global filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --global filter.lfs.process "git-lfs filter-process --skip"

      - name: Checkout repository (without LFS blobs)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & check single-file FCV-588 Standalone HTML
        run: |
          node tools/build_fcv588_standalone.mjs --check
          node tools/build_fcv588_standalone.mjs

      - name: Install Electron packager dependencies
        working-directory: apps/fcv588-electron-p30
        run: npm install --no-audit --no-fund

      - name: Verify synced Electron unit & replay matrix tests
        run: npm --prefix apps/fcv588-electron-p30 test

      - name: Build Windows Portable (.exe) and NSIS Setup Installer (.exe)
        run: npm --prefix apps/fcv588-electron-p30 run package:win

      - name: Verify generated artifacts exist
        run: |
          test -f "dist/FCV-588-Standalone.html"
          test -f "dist/electron/FCV-588-Portable-1.0.1-win-x64.exe"
          test -f "dist/electron/FCV-588-Setup-1.0.1-win-x64.exe"
          ls -lh dist/FCV-588-Standalone.html dist/electron/*.exe

      - name: Upload Standalone HTML & Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FCV-588-Standalone-Windows-Installer-and-HTML
          if-no-files-found: error
          path: |
            dist/FCV-588-Standalone.html
            dist/electron/FCV-588-Portable-1.0.1-win-x64.exe
            dist/electron/FCV-588-Setup-1.0.1-win-x64.exe

      - name: Publish Permanent GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cat <<'NOTES' > dist/RELEASE_NOTES.md
          ## FURUNO FCV-588 — Phần mềm Mô phỏng Máy Đo Sâu Dò Cá Độc Lập (v1.0.1 — Khép kín 100%)

          ### 3 Định dạng Tải về & Chạy ngay (100% Offline, Không cần cài Node.js)
          1. **`FCV-588-Portable-1.0.1-win-x64.exe`** — **1 file `.exe` duy nhất cho Windows (x64)**: Có sẵn biểu tượng FCV-588 đa độ phân giải (16–256 px), tải về nhấp đúp chạy ngay lập tức, không cần cài đặt.
          2. **`FCV-588-Setup-1.0.1-win-x64.exe`** — **Bộ cài đặt chuẩn Windows NSIS**: Cài đặt vào máy tính và tự tạo biểu tượng ngoài Desktop & Start Menu (`FURUNO FCV-588 Simulator`).
          3. **`FCV-588-Standalone.html`** — **1 file `.html` đa nền tảng (~750 KB, khóa cứng CSP offline `connect-src 'none'`)**: Chạy trực tiếp trên Windows / macOS / Linux bằng trình duyệt bất kỳ hoàn toàn offline.

          ### Các nâng cấp hoàn thiện khép kín trong bản v1.0.1
          - **Nạp cấu hình `.json` tức thời ngay cả khi máy đang BẬT:** Tự khởi động lại sạch để áp dụng và lưu ngay cấu hình mới (không nuốt lỗi, bảo toàn 100% tính tất định Replay).
          - **Hoàn thiện thị giác LCD 100% trên mọi bảng màu:** Dời hộp `TEMP GRAPH` khỏi vùng chữ số độ sâu lớn, cố định nền khởi động xanh đậm FURUNO rõ nét ngay cả trên bảng màu `White` (`Trang`), Việt hóa triệt để 100% tiêu đề menu con, dải báo động LCD (`BAO DONG 1..5`) và nhãn hộp dữ liệu khi bật `D04 Tieng Viet`.
          - **Âm thanh phần cứng chuẩn xác theo `§2.3` & `§1.18`:** Phân tách rõ `He thong > Tieng Phim: Tat` (click cơ học nhẹ) với `Bat` (tiếng *bíp* piezo FURUNO `2420 Hz`), giữ trọn vẹn tiếng *pip* bật/tắt nguồn, nấc xoay núm và còi báo động ngắt quãng tắt khi nhấn phím bất kỳ.
          - **Đồng bộ hoàn hảo bản Desktop & Windows `.bat`:** Đồng bộ `F11` với nút `Toàn màn hình` trong Electron `.exe`, giãn cách tải đôi cặp tệp Replay (`250 ms`), và sửa chuẩn đường dẫn có dấu cách trong `Chay-FCV588.bat`.

          > *Lưu ý an toàn: Phần mềm phục vụ huấn luyện và giảng dạy độc lập, không kết nối đầu dò/GPS thực tế và không dùng để dẫn tàu.*
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/FCV-588-Standalone.html" \
              "dist/electron/FCV-588-Portable-1.0.1-win-x64.exe" \
              "dist/electron/FCV-588-Setup-1.0.1-win-x64.exe" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/FCV-588-Standalone.html" \
              "dist/electron/FCV-588-Portable-1.0.1-win-x64.exe" \
              "dist/electron/FCV-588-Setup-1.0.1-win-x64.exe" \
              --title "FURUNO FCV-588 Standalone Simulator ($TAG)" \
              --notes-file dist/RELEASE_NOTES.md
          fi
